name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify committed renderer matches source
        run: |
          npm run build:renderer
          git diff --exit-code -- renderer

      - name: Resolve package and version
        id: meta
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check NPM_TOKEN
        id: token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN 未配置，本次跳过发布（配置方式见 README）"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.meta.outputs.exists == 'false' && steps.token.outputs.present == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Summary
        run: |
          {
            echo "### dsh-marktext publish"
            echo ""
            echo "- version: \`${{ steps.meta.outputs.version }}\`"
            echo "- already on npm: \`${{ steps.meta.outputs.exists }}\`"
            echo "- token present: \`${{ steps.token.outputs.present }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
