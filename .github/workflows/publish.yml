name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Toolchain
        run: |
          node --version
          npm --version

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify committed renderer matches source
        run: |
          npm run build:renderer
          git diff --exit-code -- renderer

      - name: Resolve package and version
        id: meta
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # 无需 NPM_TOKEN：npm CLI 检测到 GitHub Actions 的 OIDC 环境后会自动换发短期凭证。
      - name: Publish (trusted publishing)
        if: steps.meta.outputs.exists == 'false'
        run: npm publish --access public --provenance

      - name: Summary
        run: |
          {
            echo "### dsh-marktext publish"
            echo ""
            echo "- version: \`${{ steps.meta.outputs.version }}\`"
            echo "- already on npm: \`${{ steps.meta.outputs.exists }}\`"
            echo "- auth: npm Trusted Publishing (OIDC)"
          } >> "$GITHUB_STEP_SUMMARY"
